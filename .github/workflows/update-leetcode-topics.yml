name: Update LeetCode Topic Chart

on:
  schedule:
    - cron: "17 2 * * *" # Daily at 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch accepted submissions and update topic chart
        env:
          LEETCODE_USERNAME: chiraggd
        run: python update_leetcode_topics.py

      - name: Commit updated chart and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic_counts.json solved_problems.json leetcode-topics.svg
          if git diff --cached --quiet; then
            echo "No chart changes to commit."
          else
            git commit -m "Update LeetCode topic chart"
            git push
          fi
